name: Renderizar

# Render sem coleta. Trocar um CSS ou um template não pede dado novo - pede
# um site novo a partir do dado que já está em main. Antes, a única forma
# de republicar era bater na Receita de novo. O gerador não toca a rede;
# o que ele precisa e não está versionado (dados/completo.json) vem do
# cache que o coletar.yml grava no fim de cada dia - ou, quando o cache
# expirou, é reapurado do ZIP oficial guardado na última release bruto-*.

on:
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "fontes/**"
      - "gerar_site.py"
      - "config.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # A data que a conferência pós-deploy vai exigir do site no ar. Aqui ela
    # não vem de uma coleta: é a do ultimo.json que este render usou.
    outputs:
      data: ${{ steps.site.outputs.data }}
      # A impressão digital do build - ver o mesmo output no coletar.yml.
      gerado_em: ${{ steps.site.outputs.gerado_em }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # O mesmo par de variáveis do coletar.yml, pelo mesmo motivo: com a
      # variável de repositório BRANCH_DADOS vazia isto é o comportamento de
      # sempre (dados/ dentro do checkout de main, push na branch do
      # checkout); preenchida, o dado vem da branch órfã. O comentário longo
      # está lá.
      - name: Onde ficam os dados
        env:
          BRANCH_DADOS: ${{ vars.BRANCH_DADOS }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -n "$BRANCH_DADOS" ]; then
            echo "DIR_DADOS=dados-branch" >> "$GITHUB_ENV"
            echo "BRANCH_ALVO=$BRANCH_DADOS" >> "$GITHUB_ENV"
          else
            echo "DIR_DADOS=dados" >> "$GITHUB_ENV"
            echo "BRANCH_ALVO=$REF" >> "$GITHUB_ENV"
          fi

      # Antes do cache, e não depois: actions/checkout limpa o diretório que
      # recebe, e o cache do completo.json cai dentro dele.
      - name: Trazer a branch de dados
        if: vars.BRANCH_DADOS != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.BRANCH_DADOS }}
          path: dados-branch
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # A chave exata nunca existe de propósito: o que interessa é o
      # restore-keys, que devolve o cache mais recente com prefixo
      # "completo-" (ou seja, o da última coleta).
      - name: Restaurar completo.json do cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DIR_DADOS }}/completo.json
          key: completo-nunca
          restore-keys: |
            completo-

      # O cache expira com uma semana de inatividade. Sem ele, o mesmo
      # completo.json sai do ZIP oficial guardado em Release: o coletor em
      # modo --de-arquivo não toca a rede, e a referência é a do ultimo.json
      # versionado, para o portão comparar o dia com ele mesmo. Tudo o que
      # ele regrava em dados/ é restaurado em seguida - só o completo.json,
      # que o git ignora, sobrevive. Sem release também, aí sim é erro.
      - name: Conferir o cache ou reapurar da última release
        env:
          CHAVE: ${{ steps.cache.outputs.cache-matched-key }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$CHAVE" ] && [ -s "$DIR_DADOS/completo.json" ]; then
            echo "completo.json restaurado de $CHAVE"
            exit 0
          fi
          echo "sem completo.json em cache; procurando a última release bruto-*"
          tag=$(gh release list --repo "$REPO" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("bruto-"))] | sort_by(.createdAt) | reverse | .[0].tagName // empty')
          if [ -z "$tag" ]; then
            echo "::error::sem completo.json em cache e sem release bruto-*; rode o workflow Coletar (ele grava o cache e a release) e dispare este de novo."
            exit 1
          fi
          echo "reapurando a partir da release $tag"
          # Numa pasta, não num arquivo: a mesma versão coletada em dois dias
          # tem dois assets, e o nome deles carrega a data - o último vence.
          rm -rf "$RUNNER_TEMP/bruto" && mkdir -p "$RUNNER_TEMP/bruto"
          gh release download "$tag" --repo "$REPO" --pattern "*.zip" --dir "$RUNNER_TEMP/bruto"
          zip=$(ls "$RUNNER_TEMP"/bruto/*.zip | sort | tail -n 1)
          referencia=$(python -c "import json; print(json.load(open('$DIR_DADOS/ultimo.json', encoding='utf-8'))['data_referencia'])")
          python coletor.py --dados "$DIR_DADOS" --de-arquivo "$zip" --referencia "$referencia"
          # `-C "$DIR_DADOS" checkout -- .` e não `checkout -- dados`: o
          # pathspec "." é relativo ao diretório, então devolve o que o
          # coletor reescreveu nos dois casos - dentro de dados/ em main, ou
          # a árvore inteira do checkout da branch de dados.
          git -C "$DIR_DADOS" checkout -- .
          test -s "$DIR_DADOS/completo.json"

      - name: Gerar o site
        id: site
        run: |
          python gerar_site.py --dados "$DIR_DADOS"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          ultimo = os.path.join(os.environ["DIR_DADOS"], "ultimo.json")
          with open(ultimo, encoding="utf-8") as f:
              print("data=" + json.load(f)["data_referencia"])
          with open("site/status.json", encoding="utf-8") as f:
              print("gerado_em=" + json.load(f)["gerado_em"])
          PY

      # Mesmo padrão do coletar.yml: lastmod.json é derivado, não
      # insubstituível. Se o push falhar, a próxima run (coleta ou render)
      # refaz - e o site sai de qualquer jeito.
      - name: Commitar o lastmod
        continue-on-error: true
        env:
          DATA: ${{ steps.site.outputs.data }}
        run: |
          git -C "$DIR_DADOS" config user.name "github-actions[bot]"
          git -C "$DIR_DADOS" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$DIR_DADOS" add lastmod.json
          if git -C "$DIR_DADOS" diff --staged --quiet; then
            echo "lastmod inalterado."
            exit 0
          fi
          git -C "$DIR_DADOS" commit -m "lastmod $DATA (render)"
          git -C "$DIR_DADOS" push origin "HEAD:$BRANCH_ALVO" || {
            git -C "$DIR_DADOS" fetch origin "$BRANCH_ALVO"
            git -C "$DIR_DADOS" reset --hard "origin/$BRANCH_ALVO"
            echo "push do lastmod rejeitado; a próxima run refaz."
          }

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Guardar a lista de URLs que mudaram
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mudancas
          path: site/mudancas.txt
          if-no-files-found: ignore
          retention-days: 3

  publicar:
    needs: [render]
    runs-on: ubuntu-latest
    # Cobre o deploy (que tem teto próprio de 10 min) mais os 12 min que a
    # conferência pode passar esperando a borda do Pages.
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    # Só o deploy disputa o recurso "pages". A coleta ficava no mesmo grupo e
    # uma run enfileirada podia ser cancelada em silêncio - um dia perdido.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      # A mesma conferência do coletar.yml, duplicada de propósito: o job
      # `publicar` não faz checkout do repositório (só roda o deploy), e uma
      # action composta em .github/actions/ obrigaria a fazer um só para ler
      # o arquivo dela. A diferença é a data esperada, que aqui não vem de
      # uma coleta - vem do ultimo.json que este render usou.
      - name: Conferir o que foi publicado
        env:
          URL: ${{ steps.deploy.outputs.page_url }}
          DATA: ${{ needs.render.outputs.data }}
          GERADO_EM: ${{ needs.render.outputs.gerado_em }}
          # O mesmo 5000 do piso absoluto de NCMs no portão do coletor
          # (coletor.PISO["ncms"]): o site tem ~11 mil páginas, e abaixo
          # disso alguma coisa desabou entre a apuração e o deploy.
          PISO_PAGINAS: "5000"
          # Acima dos 600s de max-age com que a borda serve o status.json:
          # passado o TTL ela é obrigada a revalidar na origem, e o que não
          # bateu até lá deixou de ser explicável por cache.
          TETO_ESPERA: "720"
        run: |
          # page_url já termina em "/"; sem podar sairia "//status.json".
          base="${URL%/}/"
          export STATUS="$RUNNER_TEMP/status.json"
          echo "conferindo $base"
          falhou=0
          erro() { echo "::error::$1"; falhou=1; }

          # A borda do Pages serve o status.json com Cache-Control: max-age=600
          # e ignora TANTO cache-buster na query QUANTO Cache-Control: no-cache
          # - os três foram medidos contra o site no ar. Entre o deploy
          # responder e a borda entregar o build novo não existe atalho: só
          # esperar. O --retry do curl não cobria isso, porque ele reage a
          # ERRO, e uma borda velha responde 200 com o build ANTERIOR: foi o
          # alarme falso de 24, 25 e 26/08 - três dias vermelhos em que o dado
          # foi gravado e o site publicado. Aqui o laço relê até o gerado_em no
          # ar ser o desta run: a data de referência repete entre runs do mesmo
          # dia, o gerado_em não.
          if [ -z "$GERADO_EM" ]; then
            echo "::error::gerado_em não chegou do job que gerou o site"
            exit 1
          fi
          lido=""
          inicio=$SECONDS
          tentativa=0
          while :; do
            tentativa=$((tentativa + 1))
            if curl -fsS --retry 3 --retry-delay 5 --retry-all-errors \
                 -o "$STATUS" "${base}status.json"; then
              lido=$(python3 -c "import json,os;print(json.load(open(os.environ['STATUS'],encoding='utf-8')).get('gerado_em',''))") || lido="(ilegivel)"
            else
              lido="(sem resposta)"
            fi
            if [ "$lido" = "$GERADO_EM" ]; then
              break
            fi
            if [ $((SECONDS - inicio)) -ge "$TETO_ESPERA" ]; then
              erro "o Pages não serviu o build desta run em ${TETO_ESPERA}s (no ar: ${lido:-vazio}; esperado: $GERADO_EM). Passou do TTL de 600s da borda, então deixou de ser explicável por cache."
              exit "$falhou"
            fi
            echo "ainda é o build anterior (gerado_em=${lido:-vazio}); nova leitura em 15s (tentativa $tentativa)"
            sleep 15
          done
          echo "a borda entregou o build desta run em $((SECONDS - inicio))s, na tentativa $tentativa"

          # python3, e não `python`: este job não roda actions/setup-python
          # (só faz o deploy), então não existe o atalho que ela instala.
          python3 - <<'PY' || falhou=1
          import json
          import os

          try:
              with open(os.environ["STATUS"], encoding="utf-8") as f:
                  status = json.load(f)
          except (OSError, ValueError) as e:
              print("::error::status.json publicado está ilegível: %s" % e)
              raise SystemExit(1)
          print(json.dumps(status, ensure_ascii=False, indent=1))
          esperada = os.environ["DATA"]
          piso = int(os.environ["PISO_PAGINAS"])
          problemas = []
          if status.get("data_referencia") != esperada:
              problemas.append(
                  "data_referencia no ar é %r; esta run publicou %r"
                  % (status.get("data_referencia"), esperada)
              )
          paginas = status.get("paginas")
          if not isinstance(paginas, int) or paginas < piso:
              problemas.append("paginas no ar é %r; o piso é %d" % (paginas, piso))
          for p in problemas:
              print("::error::status.json publicado: " + p)
          raise SystemExit(1 if problemas else 0)
          PY

          # grep -o e não grep -c: o sitemap sai numa linha só, e -c conta
          # LINHAS - daria 1 até com o índice vazio. Três é o mínimo
          # estrutural: um bloco de NCMs, um de atributos e um geral.
          locs=$(curl -fsS "${base}sitemap.xml" | grep -o "<loc>" | wc -l)
          echo "sitemap.xml: $locs <loc>"
          [ "$locs" -ge 3 ] \
            || erro "${base}sitemap.xml tem $locs <loc>; esperado ao menos 3"

          # Sem -f de propósito: aqui o 404 É o resultado esperado, e --fail
          # faria o curl sair 22. O "|| true" cobre o servidor fora do ar,
          # em que curl sai 7 e escreve 000 - o -e do runner mataria o passo
          # antes das mensagens.
          codigo=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${base}404-que-nao-existe/" || true)
          echo "404-que-nao-existe/: HTTP $codigo"
          [ "$codigo" = "404" ] \
            || erro "${base}404-que-nao-existe/ respondeu $codigo; esperado 404"

          exit "$falhou"

  indexnow:
    needs: [publicar]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mudancas
          path: .
        continue-on-error: true
      # O arquivo de chave sozinho não faz nada: só prova a posse. O ping é
      # o que existe. Manda só o que mudou - o gerador já poda a lista
      # quando o build inteiro foi refeito. Sem indexnow_key no config.json
      # o script encerra cedo, sem tocar a rede.
      - name: Pingar o IndexNow
        run: python indexnow.py
        continue-on-error: true
