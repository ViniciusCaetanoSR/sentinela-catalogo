name: Renderizar

# Render sem coleta. Trocar um CSS ou um template não pede dado novo - pede
# um site novo a partir do dado que já está em main. Antes, a única forma
# de republicar era bater na Receita de novo. O gerador não toca a rede;
# o que ele precisa e não está versionado (dados/completo.json) vem do
# cache que o coletar.yml grava no fim de cada dia.

on:
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "fontes/**"
      - "gerar_site.py"
      - "config.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # A chave exata nunca existe de propósito: o que interessa é o
      # restore-keys, que devolve o cache mais recente com prefixo
      # "completo-" (ou seja, o da última coleta).
      - name: Restaurar completo.json do cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dados/completo.json
          key: completo-nunca
          restore-keys: |
            completo-

      - name: Conferir o que veio do cache
        env:
          CHAVE: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          if [ -z "$CHAVE" ] || [ ! -s dados/completo.json ]; then
            echo "::error::sem completo.json em cache; rode o workflow Coletar (ele grava o cache ao fim de cada dia) e dispare este de novo."
            exit 1
          fi
          echo "completo.json restaurado de $CHAVE"

      - name: Gerar o site
        id: site
        run: |
          python gerar_site.py
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("dados/ultimo.json", encoding="utf-8") as f:
              print("data=" + json.load(f)["data_referencia"])
          PY

      # Mesmo padrão do coletar.yml: lastmod.json é derivado, não
      # insubstituível. Se o push falhar, a próxima run (coleta ou render)
      # refaz - e o site sai de qualquer jeito.
      - name: Commitar o lastmod
        continue-on-error: true
        env:
          DATA: ${{ steps.site.outputs.data }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/lastmod.json
          if git diff --staged --quiet; then
            echo "lastmod inalterado."
            exit 0
          fi
          git commit -m "lastmod $DATA (render)"
          git push || {
            git fetch origin main
            git reset --hard origin/main
            echo "push do lastmod rejeitado; a próxima run refaz."
          }

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Guardar a lista de URLs que mudaram
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mudancas
          path: site/mudancas.txt
          if-no-files-found: ignore
          retention-days: 3

  publicar:
    needs: [render]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # Só o deploy disputa o recurso "pages". A coleta ficava no mesmo grupo e
    # uma run enfileirada podia ser cancelada em silêncio - um dia perdido.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  indexnow:
    needs: [publicar]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mudancas
          path: .
        continue-on-error: true
      # O arquivo de chave sozinho não faz nada: só prova a posse. O ping é
      # o que existe. Manda só o que mudou - o gerador já poda a lista
      # quando o build inteiro foi refeito. Sem indexnow_key no config.json
      # o script encerra cedo, sem tocar a rede.
      - name: Pingar o IndexNow
        run: python indexnow.py
        continue-on-error: true
