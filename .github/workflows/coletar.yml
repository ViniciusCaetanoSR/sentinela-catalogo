name: Coletar e publicar

on:
  schedule:
    # 09:00 UTC = 06:00 em Brasilia. O arquivo oficial e regenerado por
    # volta de 00:0x BRT, entao as 06:00 ja pegamos a versao do dia.
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # So o que muda a APURACAO entra aqui. templates/ e gerar_site.py
      # ficaram de fora de proposito: mexer no CSS nao pede uma coleta nova,
      # pede um render novo - e o render acontece de qualquer jeito, logo
      # abaixo, sem precisar bater no endpoint da Receita.
      - "coletor.py"
      - "config.json"

# Nada aqui pode escrever no repositorio por padrao. Cada job pede o que usa.
permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Sem rede e sem pip: a suite roda contra a fixture em tests/.
      - run: python -m unittest discover -s tests -v

  coletar:
    needs: [testes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # O retry de push precisa enxergar a base do rebase.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Sem pip install: o coletor usa so a biblioteca padrao.
      - name: Coletar do Portal Unico
        id: coleta
        run: |
          python coletor.py
          echo "data=$(python -c 'import json;print(json.load(open("dados/ultimo.json",encoding="utf-8"))["data_referencia"])')" >> "$GITHUB_OUTPUT"

      # Antes do gerador, de proposito. O endpoint ignora ?data= e nao serve
      # versoes passadas: se um bug no render derrubar o job depois daqui, o
      # dia continua salvo. Na ordem anterior ele se perdia para sempre.
      - name: Commitar o snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # site/ e dados/completo.json NAO sao versionados (ver .gitignore).
          git add dados
          if git diff --staged --quiet; then
            echo "Nada mudou hoje."
            exit 0
          fi
          # A data vem do coletor, no fuso de Brasilia. Usar `date -u` aqui
          # rotulava "coleta 2026-08-22" um commit que alterava o arquivo
          # 2026-08-21.json, toda vez que a run caia depois das 21h BRT.
          git commit -m "coleta ${{ steps.coleta.outputs.data }}"

          # Retry por REGENERACAO, nao por rebase. O rebase conflitava
          # justamente na linha que sempre difere, e um `git pull` que falha
          # mata o passo inteiro (o shell roda com -e).
          guardado="$RUNNER_TEMP/dados"
          rm -rf "$guardado" && cp -r dados "$guardado"
          for tentativa in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejeitado; refazendo sobre origin/main ($tentativa/3)"
            git fetch origin main
            git reset --hard origin/main
            rm -rf dados && cp -r "$guardado" dados
            git add dados
            if git diff --staged --quiet; then
              echo "outra run ja gravou o mesmo conteudo."
              exit 0
            fi
            git commit -m "coleta ${{ steps.coleta.outputs.data }}"
          done
          echo "::error::nao foi possivel empurrar apos 3 tentativas"
          exit 1

      - name: Gerar o site
        run: python gerar_site.py

      # Segundo commit, e de proposito. dados/lastmod.json e escrito pelo
      # GERADOR, entao nao existia ainda no commit acima - e sem ele
      # persistido o gerador acha que tudo mudou e carimba lastmod de hoje
      # nas 11 mil URLs, que e exatamente o problema que ele resolve.
      # Derivado, nao insubstituivel: se o push falhar, a proxima run refaz.
      - name: Commitar o lastmod
        continue-on-error: true
        run: |
          git add dados/lastmod.json
          if git diff --staged --quiet; then
            echo "lastmod inalterado."
            exit 0
          fi
          git commit -m "lastmod ${{ steps.coleta.outputs.data }}"
          git push || {
            git fetch origin main
            git reset --hard origin/main
            echo "push do lastmod rejeitado; a proxima run refaz."
          }

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Guardar a lista de URLs que mudaram
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mudancas
          path: site/mudancas.txt
          if-no-files-found: ignore
          retention-days: 3

  publicar:
    needs: [coletar]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # So o deploy disputa o recurso "pages". A coleta ficava no mesmo grupo e
    # uma run enfileirada podia ser cancelada em silencio - um dia perdido.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  indexnow:
    needs: [publicar]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mudancas
          path: .
        continue-on-error: true
      # O arquivo de chave sozinho nao faz nada: so prova a posse. O ping e
      # o que existe. Manda so o que mudou - o gerador ja poda a lista
      # quando o build inteiro foi refeito.
      - name: Pingar o IndexNow
        run: python indexnow.py
        continue-on-error: true

  avisar:
    needs: [testes, coletar, publicar]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Sem isto o unico sinal de que a coleta parou e o e-mail padrao do
      # GitHub para uma pessoa so. O site continua no ar mostrando a data de
      # ontem, com cara de saudavel.
      - name: Abrir ou atualizar a issue de falha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          titulo="A coleta diaria falhou"
          existente=$(gh issue list --repo "$REPO" --state open \
            --search "\"$titulo\" in:title" --json number --jq '.[0].number')
          corpo="A execucao de $(date -u +%Y-%m-%d\ %H:%M) UTC falhou.

          $RUN

          Enquanto isso o site continua publicando o ultimo dado bom - com a
          data antiga no rodape. O endpoint ignora \`?data=\`, entao cada dia
          perdido e um buraco definitivo em \`dados/historico/\`."
          if [ -n "$existente" ]; then
            gh issue comment "$existente" --repo "$REPO" --body "$corpo"
          else
            gh issue create --repo "$REPO" --title "$titulo" --body "$corpo"
          fi
