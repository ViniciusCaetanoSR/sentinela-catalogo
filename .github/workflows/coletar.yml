name: Coletar e publicar

on:
  schedule:
    # 09:00 UTC = 06:00 em Brasília. O arquivo oficial é regenerado por
    # volta de 00:0x BRT, então às 06:00 já pegamos a versão do dia.
    - cron: "0 9 * * *"
    # Resgate: 13:00 UTC = 10:00 BRT. Se a das 06:00 caiu (Receita fora do
    # ar, runner indisponível), esta tenta de novo. Se a primeira deu certo,
    # o passo "Já coletado hoje?" encontra dados/historico/<hoje>.json e o
    # job termina sem tocar na Receita.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      aceitar_queda:
        description: >-
          Válvula do portão: aceita queda rolante acima de 10 % (pisos
          absolutos e versão continuam fatais). Use só quando a Receita
          de fato encolheu a relação.
        type: boolean
        default: false
  # push não dispara coleta: o ci.yml prova o código e o render.yml cuida
  # de template/CSS. Bater na Receita só quando há dado novo para buscar.

# Nada aqui pode escrever no repositório por padrão. Cada job pede o que usa.
permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Sem rede e sem pip: a suíte roda contra a fixture em tests/.
      - run: python -m unittest discover -s tests -v

  coletar:
    needs: [testes]
    # Teste vermelho não pode custar o dia. O endpoint ignora ?data= e não
    # serve versões passadas: um teste do GERADOR quebrado às 06:00 deixava
    # um buraco definitivo em dados/historico/. No cron a coleta roda mesmo
    # com a suíte vermelha - o portão de sanidade em runtime é quem protege
    # a gravação. No disparo manual, a suíte continua mandando.
    if: >-
      always() &&
      (needs.testes.result == 'success' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Duas runs de coleta nunca ao mesmo tempo (o cron de resgate pode
    # encostar num disparo manual). Sem cancelar: a que está rodando termina
    # e a seguinte vê o snapshot já gravado.
    concurrency:
      group: coleta
      cancel-in-progress: false
    outputs:
      pular: ${{ steps.hoje.outputs.pular }}
      data: ${{ steps.coleta.outputs.data }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O retry de push é por regeneração, não por rebase: basta a ponta.
          fetch-depth: 1

      # Onde vive o dado desta run, e para onde vai o commit dele. Duas
      # variáveis num passo só, para os passos seguintes não precisarem saber
      # de nada: quem mexe em dado usa "$DIR_DADOS", quem empurra usa
      # "$BRANCH_ALVO", e o caminho é um só em vez de dois YAMLs paralelos.
      #
      # Com a variável de repositório BRANCH_DADOS VAZIA - o padrão, e o que
      # vale hoje - nada muda: DIR_DADOS=dados é o mesmo diretório que o
      # coletor usaria sozinho, `git -C dados` é o mesmo repositório do
      # checkout, e BRANCH_ALVO é a branch que está no checkout, para onde um
      # `git push` sem argumento iria de qualquer forma.
      #
      # Preenchida (valor esperado: "dados"), o passo seguinte traz a branch
      # órfã para dados-branch/ e é lá que tudo passa a acontecer - inclusive
      # o commit, porque aquele diretório é OUTRO repositório. Ver "Mover
      # dados/ para a branch própria" no CONTRIBUTING.md.
      - name: Onde ficam os dados
        env:
          BRANCH_DADOS: ${{ vars.BRANCH_DADOS }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -n "$BRANCH_DADOS" ]; then
            echo "DIR_DADOS=dados-branch" >> "$GITHUB_ENV"
            echo "BRANCH_ALVO=$BRANCH_DADOS" >> "$GITHUB_ENV"
          else
            echo "DIR_DADOS=dados" >> "$GITHUB_ENV"
            echo "BRANCH_ALVO=$REF" >> "$GITHUB_ENV"
          fi

      # path: dados-branch, e não dados, para não colidir com a pasta que
      # ainda vem no checkout de main enquanto a transição não terminar.
      - name: Trazer a branch de dados
        if: vars.BRANCH_DADOS != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.BRANCH_DADOS }}
          path: dados-branch
          fetch-depth: 1

      # O cron de resgate só tem trabalho se o das 06:00 falhou. A data é a
      # de Brasília, a mesma que o coletor usa para nomear o snapshot.
      - name: Já coletado hoje?
        id: hoje
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          HOJE=$(TZ=America/Sao_Paulo date +%F)
          echo "hoje=$HOJE" >> "$GITHUB_OUTPUT"
          if [ "$EVENTO" = "schedule" ] && [ -f "$DIR_DADOS/historico/$HOJE.json" ]; then
            echo "já coletado hoje ($HOJE): nada a fazer."
            echo "pular=true" >> "$GITHUB_OUTPUT"
          else
            echo "pular=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.hoje.outputs.pular != 'true'
        with:
          python-version: "3.12"

      # Sem pip install: o coletor usa só a biblioteca padrão.
      # No cron `inputs` é vazio, então a comparação dá falso e a variável
      # fica vazia - o coletor só liga a válvula com o valor exato "1".
      - name: Coletar do Portal Único
        id: coleta
        if: steps.hoje.outputs.pular != 'true'
        env:
          SENTINELA_ACEITAR_QUEDA: ${{ inputs.aceitar_queda == true && '1' || '' }}
        run: |
          python coletor.py --dados "$DIR_DADOS"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          ultimo = os.path.join(os.environ["DIR_DADOS"], "ultimo.json")
          with open(ultimo, encoding="utf-8") as f:
              s = json.load(f)
          print("data=" + s["data_referencia"])
          print("versao=" + str(s["contagens"].get("versao", "")))
          print("sha=" + str(s["http"].get("sha256_json", "")))
          print("bruto_novo=" + str(bool(s.get("bruto_novo"))).lower())
          PY

      # Mesmo se o coletor caiu no meio: o que chegou ao disco fica 14 dias
      # ao alcance de quem for recuperar o dia à mão (ver README).
      - name: Guardar o snapshot do dia como artifact
        if: always() && steps.hoje.outputs.pular != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-${{ steps.coleta.outputs.data || steps.hoje.outputs.hoje }}
          path: |
            ${{ env.DIR_DADOS }}/historico/*.json
            ${{ env.DIR_DADOS }}/bruto.zip
          retention-days: 14
          if-no-files-found: ignore

      # Antes do gerador, de propósito. O endpoint ignora ?data= e não serve
      # versões passadas: se um bug no render derrubar o job depois daqui, o
      # dia continua salvo. Na ordem anterior ele se perdia para sempre.
      - name: Commitar o snapshot
        if: steps.hoje.outputs.pular != 'true'
        env:
          DATA: ${{ steps.coleta.outputs.data }}
        run: |
          git -C "$DIR_DADOS" config user.name "github-actions[bot]"
          git -C "$DIR_DADOS" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # completo.json e bruto.zip NÃO são versionados: em main pelo
          # .gitignore da raiz, na branch de dados pelo .gitignore que o
          # ferramentas/migrar-dados.sh põe nela. site/ idem.
          # `git -C "$DIR_DADOS" add .` serve aos dois casos - dentro da pasta
          # de dados é exatamente o que `git add dados` sempre fez.
          git -C "$DIR_DADOS" add .
          if git -C "$DIR_DADOS" diff --staged --quiet; then
            echo "Nada mudou hoje."
            exit 0
          fi
          # A data vem do coletor, no fuso de Brasília. Usar `date -u` aqui
          # rotulava "coleta 2026-08-22" um commit que alterava o arquivo
          # 2026-08-21.json, toda vez que a run caía depois das 21h BRT.
          git -C "$DIR_DADOS" commit -m "coleta $DATA"

          # Retry por REGENERAÇÃO, não por rebase. O rebase conflitava
          # justamente na linha que sempre difere, e um `git pull` que falha
          # mata o passo inteiro (o shell roda com -e).
          #
          # tar, e não `cp -r`: na branch de dados aquele diretório É um
          # repositório, e levar o .git no bolso desfaria o fetch/reset que
          # acabou de acontecer. Extrair por cima basta - o coletor nunca
          # APAGA arquivo em dados/, só acrescenta e reescreve.
          guardado="$RUNNER_TEMP/dados.tar"
          rm -f "$guardado"
          tar -C "$DIR_DADOS" --exclude=.git -cf "$guardado" .
          for tentativa in 1 2 3; do
            if git -C "$DIR_DADOS" push origin "HEAD:$BRANCH_ALVO"; then exit 0; fi
            echo "push rejeitado; refazendo sobre origin/$BRANCH_ALVO ($tentativa/3)"
            git -C "$DIR_DADOS" fetch origin "$BRANCH_ALVO"
            git -C "$DIR_DADOS" reset --hard "origin/$BRANCH_ALVO"
            tar -C "$DIR_DADOS" -xf "$guardado"
            git -C "$DIR_DADOS" add .
            if git -C "$DIR_DADOS" diff --staged --quiet; then
              echo "outra run já gravou o mesmo conteúdo."
              exit 0
            fi
            git -C "$DIR_DADOS" commit -m "coleta $DATA"
          done
          echo "::error::não foi possível empurrar após 3 tentativas"
          exit 1

      # O ZIP oficial muda de bytes a cada pedido, mas o JSON de dentro não.
      # Quando o sha256 do JSON muda, o arquivo vai para um Release: é o
      # único lugar de onde dá para reapurar um dia, já que a Receita não
      # serve versões passadas. Nunca derruba o dia (continue-on-error).
      - name: Guardar o bruto como release
        if: steps.hoje.outputs.pular != 'true' && steps.coleta.outputs.bruto_novo == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DATA: ${{ steps.coleta.outputs.data }}
          VERSAO: ${{ steps.coleta.outputs.versao }}
          SHA: ${{ steps.coleta.outputs.sha }}
        run: |
          tag="bruto-$VERSAO"
          if ! gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$REPO" \
              --title "Arquivo oficial, versão $VERSAO" \
              --notes "sha256 do JSON descompactado: $SHA. Coletado em $DATA."
          fi
          # Copiado com o nome final: o asset é baixado com esse nome, não
          # como "bruto.zip". --clobber cobre a repetição do mesmo dia.
          cp "$DIR_DADOS/bruto.zip" "$RUNNER_TEMP/ATRIBUTOS_POR_NCM_$DATA.zip"
          gh release upload "$tag" "$RUNNER_TEMP/ATRIBUTOS_POR_NCM_$DATA.zip" \
            --repo "$REPO" --clobber

      - name: Gerar o site
        if: steps.hoje.outputs.pular != 'true'
        run: python gerar_site.py --dados "$DIR_DADOS"

      # completo.json não é versionado (4,8 MB de churn diário), mas o
      # render.yml precisa dele para republicar o site sem bater na Receita.
      # A chave tem a data; o render restaura a mais recente por prefixo.
      - name: Guardar completo.json em cache
        if: steps.hoje.outputs.pular != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DIR_DADOS }}/completo.json
          key: completo-${{ steps.coleta.outputs.data }}

      # Segundo commit, e de propósito. dados/lastmod.json é escrito pelo
      # GERADOR, então não existia ainda no commit acima - e sem ele
      # persistido o gerador acha que tudo mudou e carimba lastmod de hoje
      # nas 11 mil URLs, que é exatamente o problema que ele resolve.
      # Derivado, não insubstituível: se o push falhar, a próxima run refaz.
      - name: Commitar o lastmod
        if: steps.hoje.outputs.pular != 'true'
        continue-on-error: true
        env:
          DATA: ${{ steps.coleta.outputs.data }}
        run: |
          git -C "$DIR_DADOS" add lastmod.json
          if git -C "$DIR_DADOS" diff --staged --quiet; then
            echo "lastmod inalterado."
            exit 0
          fi
          git -C "$DIR_DADOS" commit -m "lastmod $DATA"
          git -C "$DIR_DADOS" push origin "HEAD:$BRANCH_ALVO" || {
            git -C "$DIR_DADOS" fetch origin "$BRANCH_ALVO"
            git -C "$DIR_DADOS" reset --hard "origin/$BRANCH_ALVO"
            echo "push do lastmod rejeitado; a próxima run refaz."
          }

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.hoje.outputs.pular != 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.hoje.outputs.pular != 'true'
        with:
          path: site

      - name: Guardar a lista de URLs que mudaram
        if: steps.hoje.outputs.pular != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mudancas
          path: site/mudancas.txt
          if-no-files-found: ignore
          retention-days: 3

  publicar:
    needs: [coletar]
    # Quando o cron de resgate encontra o dia já coletado, não há o que
    # publicar - o deploy das 06:00 já está no ar.
    if: success() && needs.coletar.outputs.pular != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # Só o deploy disputa o recurso "pages". A coleta ficava no mesmo grupo e
    # uma run enfileirada podia ser cancelada em silêncio - um dia perdido.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # No nível do job de propósito: o contexto `secrets` não existe no `if:`
    # de um passo, mas o `env` existe. Sem o secret a variável fica vazia e o
    # passo do monitor é pulado.
    env:
      HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      # O deploy só diz "publicado"; ninguém conferia o que a URL PÚBLICA
      # devolve. Um base_path errado, um artifact velho ou um Pages que ficou
      # na versão anterior publicam em silêncio, e o site continua com cara de
      # saudável. Aqui quem responde é a origem de verdade, de fora do runner.
      # Qualquer checagem vermelha derruba o job, e o job "avisar" abre a issue.
      - name: Conferir o que foi publicado
        env:
          URL: ${{ steps.deploy.outputs.page_url }}
          DATA: ${{ needs.coletar.outputs.data }}
          # O mesmo 5000 do piso absoluto de NCMs no portão do coletor
          # (coletor.PISO["ncms"]): o site tem ~11 mil páginas, e abaixo
          # disso alguma coisa desabou entre a apuração e o deploy.
          PISO_PAGINAS: "5000"
        run: |
          # page_url já termina em "/"; sem podar sairia "//status.json".
          base="${URL%/}/"
          export STATUS="$RUNNER_TEMP/status.json"
          echo "conferindo $base"
          falhou=0
          erro() { echo "::error::$1"; falhou=1; }

          # --retry-all-errors: entre o deploy responder e o CDN do Pages
          # servir o build novo há uma janela de alguns segundos.
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors \
            -o "$STATUS" "${base}status.json" \
            || erro "${base}status.json não respondeu"

          # python3, e não `python`: este job não roda actions/setup-python
          # (só faz o deploy), então não existe o atalho que ela instala.
          python3 - <<'PY' || falhou=1
          import json
          import os

          try:
              with open(os.environ["STATUS"], encoding="utf-8") as f:
                  status = json.load(f)
          except (OSError, ValueError) as e:
              print("::error::status.json publicado está ilegível: %s" % e)
              raise SystemExit(1)
          print(json.dumps(status, ensure_ascii=False, indent=1))
          esperada = os.environ["DATA"]
          piso = int(os.environ["PISO_PAGINAS"])
          problemas = []
          if status.get("data_referencia") != esperada:
              problemas.append(
                  "data_referencia no ar é %r; esta run publicou %r"
                  % (status.get("data_referencia"), esperada)
              )
          paginas = status.get("paginas")
          if not isinstance(paginas, int) or paginas < piso:
              problemas.append("paginas no ar é %r; o piso é %d" % (paginas, piso))
          for p in problemas:
              print("::error::status.json publicado: " + p)
          raise SystemExit(1 if problemas else 0)
          PY

          # grep -o e não grep -c: o sitemap sai numa linha só, e -c conta
          # LINHAS - daria 1 até com o índice vazio. Três é o mínimo
          # estrutural: um bloco de NCMs, um de atributos e um geral.
          locs=$(curl -fsS "${base}sitemap.xml" | grep -o "<loc>" | wc -l)
          echo "sitemap.xml: $locs <loc>"
          [ "$locs" -ge 3 ] \
            || erro "${base}sitemap.xml tem $locs <loc>; esperado ao menos 3"

          # Sem -f de propósito: aqui o 404 É o resultado esperado, e --fail
          # faria o curl sair 22. O "|| true" cobre o servidor fora do ar,
          # em que curl sai 7 e escreve 000 - o -e do runner mataria o passo
          # antes das mensagens.
          codigo=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${base}404-que-nao-existe/" || true)
          echo "404-que-nao-existe/: HTTP $codigo"
          [ "$codigo" = "404" ] \
            || erro "${base}404-que-nao-existe/ respondeu $codigo; esperado 404"

          exit "$falhou"

      # O dead-man switch de verdade. Todo alerta deste repositório - a issue
      # do job "avisar", o vigia.yml - depende de o GitHub continuar rodando
      # workflows aqui, e é exatamente isso que para de acontecer quando o
      # cron é desativado por inatividade. O monitor externo funciona ao
      # contrário: ele avisa por e-mail quando o ping NÃO chega no período
      # configurado, então sobrevive ao repositório inteiro parar. Sem o
      # secret o passo é pulado; se o ping falhar, o dia não se perde por isso.
      - name: Avisar o monitor externo
        if: env.HEALTHCHECKS_URL != ''
        continue-on-error: true
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_URL"

  indexnow:
    needs: [coletar, publicar]
    if: success() && needs.coletar.outputs.pular != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mudancas
          path: .
        continue-on-error: true
      # O arquivo de chave sozinho não faz nada: só prova a posse. O ping é
      # o que existe. Manda só o que mudou - o gerador já poda a lista
      # quando o build inteiro foi refeito. Sem indexnow_key no config.json
      # o script encerra cedo, sem tocar a rede.
      - name: Pingar o IndexNow
        run: python indexnow.py
        continue-on-error: true

  # A coleta das 06:00 falhou e a de resgate passou: a issue aberta pelo
  # job "avisar" já não descreve a realidade. Só no cron e só quando a
  # cadeia inteira (testes, coleta, deploy) ficou verde.
  recuperou:
    needs: [testes, coletar, publicar]
    if: success() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Fechar as issues de falha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DATA: ${{ needs.coletar.outputs.data }}
        run: |
          abertas=$(gh issue list --repo "$REPO" --state open --label coleta-falhou \
            --json number --jq '.[].number')
          if [ -z "$abertas" ]; then
            echo "nenhuma issue de falha aberta."
            exit 0
          fi
          for n in $abertas; do
            gh issue close "$n" --repo "$REPO" --comment "coleta de $DATA publicada"
          done

  avisar:
    needs: [testes, coletar, publicar]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Sem isto o único sinal de que a coleta parou é o e-mail padrão do
      # GitHub para uma pessoa só. O site continua no ar mostrando a data de
      # ontem, com cara de saudável.
      - name: Abrir ou atualizar a issue de falha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENTO: ${{ github.event_name }}
          R_TESTES: ${{ needs.testes.result }}
          R_COLETAR: ${{ needs.coletar.result }}
          R_PUBLICAR: ${{ needs.publicar.result }}
        run: |
          # A label é a chave de deduplicação: buscar por título na API de
          # search demora para indexar e abria issue duplicada.
          gh label create coleta-falhou --repo "$REPO" --force \
            --color B60205 --description "A coleta diária falhou"
          existente=$(gh issue list --repo "$REPO" --state open --label coleta-falhou \
            --json number --jq '.[0].number')
          corpo="A execução de $(date -u +%Y-%m-%d\ %H:%M) UTC (evento: $EVENTO) falhou.

          | job | resultado |
          |---|---|
          | testes | $R_TESTES |
          | coletar | $R_COLETAR |
          | publicar | $R_PUBLICAR |

          $RUN

          Enquanto isso o site continua publicando o último dado bom - com a
          data antiga no rodapé. O endpoint ignora \`?data=\`, então cada dia
          perdido é um buraco definitivo em \`dados/historico/\`. O artifact
          \`snapshot-<data>\` desta run guarda o que chegou ao disco (ver
          'Recuperar um dia perdido' no README)."
          if [ -n "$existente" ]; then
            gh issue comment "$existente" --repo "$REPO" --body "$corpo"
          else
            gh issue create --repo "$REPO" --title "A coleta diária falhou" \
              --label coleta-falhou --body "$corpo"
          fi
