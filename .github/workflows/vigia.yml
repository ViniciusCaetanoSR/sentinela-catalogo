name: Vigia

# Interruptor de homem morto. O workflow de coleta só avisa quando FALHA -
# ele não tem como avisar que deixou de rodar. O GitHub desativa cron de
# repositório parado, e nesse caso o site fica no ar, bonito, servindo a
# data de semanas atrás sem nenhum sinal de que parou.
#
# O QUE ELE NÃO COBRE, e é o próprio modo de falha que vigia: este cron é do
# MESMO repositório, e o GitHub desativa todos juntos. Se a inatividade
# desligar o cron da coleta, desliga o daqui também - e o silêncio fica
# completo. Também não cobre o deploy: ele lê o dados/ultimo.json do
# checkout (de main ou da branch de dados, conforme a variável
# BRANCH_DADOS), não o site publicado (o que está NO AR é conferido pelo passo
# "Conferir o que foi publicado" do coletar.yml, com o site/status.json).
# O único alerta que sobrevive ao repositório inteiro parar é o monitor
# externo, fora do GitHub - ver "Monitor externo" no README.

on:
  schedule:
    - cron: "0 15 * * *"   # 12:00 BRT, seis horas depois da coleta e duas do resgate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # O mesmo interruptor do coletar.yml e do render.yml: com a variável de
      # repositório BRANCH_DADOS vazia, o snapshot é o do checkout de main,
      # como sempre. O vigia precisa dele em qualquer um dos dois lugares -
      # um homem morto que perde o arquivo de vista deixa de vigiar em
      # silêncio, que é o pior desfecho possível para este workflow.
      - name: Onde ficam os dados
        env:
          BRANCH_DADOS: ${{ vars.BRANCH_DADOS }}
        run: |
          if [ -n "$BRANCH_DADOS" ]; then
            echo "DIR_DADOS=dados-branch" >> "$GITHUB_ENV"
          else
            echo "DIR_DADOS=dados" >> "$GITHUB_ENV"
          fi

      - name: Trazer a branch de dados
        if: vars.BRANCH_DADOS != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ vars.BRANCH_DADOS }}
          path: dados-branch
          fetch-depth: 1

      - name: O snapshot está velho?
        id: idade
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import date

          ultimo = os.path.join(os.environ["DIR_DADOS"], "ultimo.json")
          with open(ultimo, encoding="utf-8") as f:
              ref = date.fromisoformat(json.load(f)["data_referencia"])
          dias = (date.today() - ref).days
          print(f"dias={dias}")
          print(f"referencia={ref.isoformat()}")
          PY

      - name: Avisar se passou de dois dias
        if: fromJSON(steps.idade.outputs.dias) > 2
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REFERENCIA: ${{ steps.idade.outputs.referencia }}
          DIAS: ${{ steps.idade.outputs.dias }}
        run: |
          # Mesma deduplicação do coletar.yml: por label, não por busca.
          gh label create vigia --repo "$REPO" --force \
            --color D93F0B --description "A coleta parou de rodar"
          existente=$(gh issue list --repo "$REPO" --state open --label vigia \
            --json number --jq '.[0].number')
          corpo="O último snapshot é de $REFERENCIA - há $DIAS dias.

          O workflow de coleta não está falhando: ele não está rodando. Causa
          provável é o GitHub ter desativado o cron por inatividade no
          repositório. O site continua no ar servindo dado velho.

          Se o monitor externo estiver configurado (secret \`HEALTHCHECKS_URL\`,
          ver 'Monitor externo' no README), ele também já deve ter avisado por
          e-mail: o ping do fim da publicação parou de chegar. Se NÃO avisou,
          desconfie do próprio monitor antes de desconfiar da coleta. E se
          esta issue não existir num dia em que a coleta parou, o cron daqui
          caiu junto com o dela - é o buraco que só o monitor externo tapa."
          if [ -n "$existente" ]; then
            gh issue comment "$existente" --repo "$REPO" --body "$corpo"
          else
            gh issue create --repo "$REPO" --title "A coleta parou de rodar" \
              --label vigia --body "$corpo"
          fi
