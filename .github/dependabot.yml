version: 2
updates:
  # As actions estao presas por SHA - o Dependabot e quem mantem os SHAs
  # atualizados. Sem ele, pinar vira congelar, e congelar num commit com
  # falha de seguranca e pior do que seguir a tag.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
